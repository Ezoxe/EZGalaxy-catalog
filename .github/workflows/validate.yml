name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-test.txt

      - run: pip install -r tools/requirements-test.txt

      - name: Manifests, versions and shared backend
        run: python tools/catalog_tool.py validate

      - name: Changed apps have a new version
        if: github.event_name == 'pull_request'
        run: python tools/catalog_tool.py check-bumps "origin/${{ github.base_ref }}"

      - name: Every backend starts and serves its app
        run: python tools/smoke_test.py

      - name: IT Discovery tests
        working-directory: packages/apps/com.ezgalaxy.it-discovery/backend
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: apps
    steps:
      - uses: actions/checkout@v4
      - name: Build every image and wait for its health check
        run: |
          set -eu
          for manifest in packages/apps/*/ezcontainer.json; do
            dir=$(dirname "$manifest")
            id=$(basename "$dir")
            port=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8-sig'))['docker']['port'])" "$manifest")
            health=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8-sig'))['docker'].get('healthcheck',{}).get('endpoint','/'))" "$manifest")
            echo "::group::$id"
            docker build -q -t "ci-$id" "$dir"
            docker run -d --name "ci-$id" -p 18000:"$port" "ci-$id" >/dev/null
            ok=0
            for i in $(seq 1 30); do
              if curl -fs "http://127.0.0.1:18000$health" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { docker logs "ci-$id"; echo "::error::$id never became healthy"; exit 1; }
            docker rm -f "ci-$id" >/dev/null
            docker rmi "ci-$id" >/dev/null
            echo "::endgroup::"
          done
