<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug - Project Hub</title>
  <style>
    body { 
      background: #0a0a0f; 
      color: #fff; 
      font-family: system-ui; 
      padding: 20px;
    }
    .test { 
      padding: 10px; 
      margin: 10px 0; 
      border-radius: 8px; 
      background: rgba(255,255,255,0.1);
    }
    .ok { border-left: 4px solid #0f0; }
    .error { border-left: 4px solid #f00; }
    pre { 
      background: rgba(0,0,0,0.5); 
      padding: 10px; 
      overflow-x: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🔧 Debug - Project Hub</h1>
  <div id="results"></div>
  <hr>
  <h2>Test React Render</h2>
  <div id="react-test"></div>
  
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/framer-motion.min.js"></script>
  <script src="./vendor/recharts.min.js"></script>
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/sortable.min.js"></script>
  
  <script>
    const results = document.getElementById('results');
    
    function test(name, fn) {
      const div = document.createElement('div');
      div.className = 'test';
      try {
        const result = fn();
        div.className += ' ok';
        div.innerHTML = `✅ <strong>${name}</strong>: ${result}`;
      } catch (e) {
        div.className += ' error';
        div.innerHTML = `❌ <strong>${name}</strong>: ${e.message}<pre>${e.stack}</pre>`;
      }
      results.appendChild(div);
    }
    
    // Test each library
    test('React', () => {
      if (!window.React) throw new Error('React not found');
      return `v${React.version}, hooks: ${['useState', 'useEffect', 'useCallback', 'useMemo', 'useRef'].filter(h => typeof React[h] === 'function').join(', ')}`;
    });
    
    test('ReactDOM', () => {
      if (!window.ReactDOM) throw new Error('ReactDOM not found');
      if (typeof ReactDOM.createRoot !== 'function') throw new Error('createRoot not found');
      return `v${ReactDOM.version}, createRoot: ✓`;
    });
    
    test('Motion', () => {
      if (!window.Motion) throw new Error('Motion not found');
      if (!Motion.motion) throw new Error('motion not found in Motion');
      if (!Motion.AnimatePresence) throw new Error('AnimatePresence not found');
      return 'motion: ✓, AnimatePresence: ✓';
    });
    
    test('Recharts', () => {
      if (!window.Recharts) throw new Error('Recharts not found');
      const components = ['ResponsiveContainer', 'LineChart', 'BarChart', 'PieChart', 'ComposedChart'];
      const missing = components.filter(c => !Recharts[c]);
      if (missing.length) throw new Error(`Missing: ${missing.join(', ')}`);
      return components.join(', ');
    });
    
    test('LucideIcons', () => {
      if (!window.LucideIcons) throw new Error('LucideIcons not found');
      const count = Object.keys(LucideIcons).length;
      if (count < 10) throw new Error(`Only ${count} icons found`);
      return `${count} icons available`;
    });
    
    test('Sortable', () => {
      if (!window.Sortable) throw new Error('Sortable not found');
      return 'Sortable class: ✓';
    });
    
    // Test React rendering
    test('React createElement', () => {
      const el = React.createElement('div', { className: 'test' }, 'Hello');
      if (!el || !el.props) throw new Error('createElement failed');
      return 'createElement works';
    });
    
    test('React useState', () => {
      // Simple component using useState
      function TestComponent() {
        const [count, setCount] = React.useState(0);
        return React.createElement('button', { 
          onClick: () => setCount(c => c + 1) 
        }, `Count: ${count}`);
      }
      const el = React.createElement(TestComponent);
      if (!el) throw new Error('Component creation failed');
      return 'useState component created';
    });
    
    // Actually render to DOM
    setTimeout(() => {
      test('ReactDOM.createRoot render', () => {
        const container = document.getElementById('react-test');
        
        function App() {
          const [count, setCount] = React.useState(0);
          
          return React.createElement('div', { style: { padding: '20px', background: 'rgba(0,255,0,0.1)', borderRadius: '8px' }},
            React.createElement('h3', null, '🎉 React is working!'),
            React.createElement('p', null, `Count: ${count}`),
            React.createElement('button', { 
              onClick: () => setCount(c => c + 1),
              style: { padding: '10px 20px', fontSize: '16px', cursor: 'pointer' }
            }, 'Increment'),
            React.createElement('div', { style: { marginTop: '10px' }},
              React.createElement(Motion.motion.div, {
                initial: { opacity: 0, scale: 0.5 },
                animate: { opacity: 1, scale: 1 },
                style: { padding: '10px', background: 'rgba(0,100,255,0.2)', borderRadius: '4px' }
              }, '✨ Framer Motion animated!')
            )
          );
        }
        
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
        return 'Rendered to #react-test';
      });
    }, 100);
  </script>
</body>
</html>
