<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Discovery — Découvre l'informatique</title>

  <!-- EZGalaxy Design System -->
  <link rel="stylesheet" href="./ezgalaxy-base.css">
  <link rel="stylesheet" href="./ezgalaxy-animations.css">

  <!-- App styles -->
  <link rel="stylesheet" href="./style.css">

  <!-- Error overlay (debug) -->
  <script>
    (function () {
      var overlay = null;
      function getOverlay() {
        if (overlay) return overlay;
        overlay = document.createElement('pre');
        overlay.id = 'ez-error-overlay';
        overlay.style.cssText =
          'position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;' +
          'margin:0;padding:12px 16px;font:12px/1.6 monospace;color:#fca5a5;' +
          'background:rgba(127,29,29,0.92);border-top:2px solid #ef4444;z-index:99999;display:none;';
        document.body.appendChild(overlay);
        return overlay;
      }
      window.__ezShowError = function (msg) {
        var el = getOverlay();
        el.style.display = 'block';
        el.textContent += (el.textContent ? '\n---\n' : '') + msg;
      };
      window.__ezScriptError = function (src) {
        window.__ezShowError('Script failed to load: ' + src);
      };
      window.onerror = function (msg, src, line, col, err) {
        var txt = 'Error: ' + msg + '\nSource: ' + src + ':' + line + ':' + col;
        if (err && err.stack) txt += '\n' + err.stack;
        window.__ezShowError(txt);
      };
      window.onunhandledrejection = function (e) {
        var r = e.reason;
        window.__ezShowError('Unhandled rejection: ' + (r && r.stack ? r.stack : r));
      };
    })();
  </script>

  <!-- EZGalaxy SDK (loaded dynamically from platform) -->\n  <script>\n    (function() {\n      var s = document.createElement('script');\n      s.src = '/api/ezgalaxy-sdk.js';\n      s.onerror = function() { /* SDK not available — dev/standalone mode */ };\n      document.head.appendChild(s);\n    })();\n  </script>

  <!-- App scripts (order matters: data → effects → app) -->
  <script defer src="./data.js"    onerror="window.__ezScriptError && window.__ezScriptError('./data.js')"></script>
  <script defer src="./effects.js" onerror="window.__ezScriptError && window.__ezScriptError('./effects.js')"></script>
  <script defer src="./app.js"     onerror="window.__ezScriptError && window.__ezScriptError('./app.js')"></script>
</head>
<body>

  <!-- Particle background -->
  <canvas id="particles-canvas"></canvas>

  <!-- Main app container -->
  <div id="app" class="app ez-fade-in">
    <div class="loading-screen">
      <div class="loading-icon">💡</div>
      <h1 class="loading-title">IT Discovery</h1>
      <p class="loading-sub">Initialisation...</p>
      <div class="loading-bar"><div class="loading-bar-inner"></div></div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <noscript>
    <div style="padding:32px;text-align:center;color:#e5e7eb;">
      <h2>⚠️ JavaScript requis</h2>
      <p>Cette application nécessite JavaScript pour fonctionner. Merci de l'activer dans les paramètres de votre navigateur.</p>
    </div>
  </noscript>

</body>
</html>
